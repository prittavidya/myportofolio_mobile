name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI: build_runner, cek format (dart format), analisis statis
  # (flutter analyze), dan menjalankan test beserta coverage.
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  # CD: hanya berjalan jika job build berhasil, lalu mengompilasi APK
  # release dan mengunggahnya sebagai artefak yang bisa diunduh.
  build_apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate json_serializable code
        run: dart run build_runner build --delete-conflicting-outputs

      # Jika variabel repositori API_BASE_URL belum diatur, pakai default
      # emulator (http://10.0.2.2:8000) agar nilai kosong tidak menimpa
      # defaultValue di lib/config.dart.
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
